<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Work-log card: wide crop of the username-first login page in its local-password state. Wireframe only: no real data or branding. -->
    <defs>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#14304a" />
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#00eeff" stop-opacity=".1" />
            <stop offset="1" stop-color="#00eeff" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
    </defs>

    <rect width="1200" height="352" fill="#07111c" />
    <rect width="1200" height="352" fill="url(#dots)" />
    <ellipse cx="600" cy="176" rx="520" ry="220" fill="url(#glow)" />

    <!-- side HUD: route decision (left) and session pill (right), decoration in the crop zone -->
    <g fill="#4a6a88">
        <text x="40" y="120">ROUTE</text>
        <text x="40" y="200">MODE</text>
    </g>
    <rect x="40" y="130" width="150" height="24" rx="12" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="54" y="146" fill="#00eeff">LOCAL</text>
    <rect x="110" y="139" width="66" height="6" rx="2" fill="#00eeff" fill-opacity=".6" />
    <rect x="40" y="210" width="150" height="24" rx="12" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-opacity=".6" />
    <rect x="54" y="219" width="90" height="6" rx="2" fill="#ffb020" />

    <rect x="1010" y="130" width="150" height="24" rx="12" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
    <circle cx="1026" cy="142" r="4" fill="#ff0066" />
    <rect x="1038" y="139" width="104" height="6" rx="2" fill="#ff0066" fill-opacity=".8" />
    <rect x="1010" y="170" width="120" height="6" rx="2" fill="#1b3550" />
    <rect x="1010" y="186" width="90" height="6" rx="2" fill="#1b3550" />

    <!-- login card -->
    <rect x="250" y="34" width="700" height="284" rx="8" fill="#0a1724" stroke="#16324a" filter="url(#shadow)" />

    <!-- logo section -->
    <path d="M330 78l28 16v32l-28 16-28-16V94z" fill="none" stroke="#00eeff" stroke-width="2" />
    <circle cx="330" cy="110" r="9" fill="#00eeff" fill-opacity=".8" />
    <rect x="380" y="94" width="150" height="14" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="380" y="116" width="100" height="8" rx="2" fill="#2a4a66" />
    <rect x="302" y="170" width="220" height="7" rx="2" fill="#1b3550" />
    <rect x="302" y="184" width="180" height="7" rx="2" fill="#1b3550" />
    <circle cx="322" cy="258" r="20" fill="#0d2133" stroke="#2a4a66" />
    <circle cx="322" cy="252" r="7" fill="#2a4a66" />
    <path d="M309 270a13 9 0 0 1 26 0" fill="#2a4a66" />
    <rect x="354" y="244" width="150" height="28" rx="14" fill="#0d2133" stroke="#16324a" />
    <rect x="368" y="255" width="110" height="6" rx="2" fill="#2a4a66" />

    <rect x="600" y="66" width="1" height="220" fill="#14304a" />

    <!-- form -->
    <rect x="640" y="66" width="140" height="12" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <text x="640" y="104" fill="#4a6a88">USERNAME</text>
    <rect x="640" y="112" width="270" height="34" rx="4" fill="#07111c" stroke="#2a4a66" />
    <rect x="654" y="125" width="96" height="8" rx="2" fill="#c8d8f0" fill-opacity=".7" />
    <text x="640" y="170" fill="#4a6a88">PASSWORD</text>
    <rect x="722" y="162" width="44" height="12" rx="6" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <rect x="732" y="166" width="24" height="4" rx="2" fill="#00eeff" />
    <rect x="640" y="178" width="270" height="34" rx="4" fill="#07111c" stroke="#00eeff" stroke-opacity=".8" />
    <g fill="#c8d8f0" fill-opacity=".7">
        <circle cx="658" cy="195" r="3" /><circle cx="670" cy="195" r="3" /><circle cx="682" cy="195" r="3" />
        <circle cx="694" cy="195" r="3" /><circle cx="706" cy="195" r="3" /><circle cx="718" cy="195" r="3" />
    </g>
    <rect x="728" y="187" width="2" height="16" fill="#00eeff" />
    <rect x="640" y="228" width="270" height="34" rx="4" fill="#00eeff" />
    <text x="775" y="249" font-size="10" fill="#07111c" font-weight="bold" text-anchor="middle">LOGIN</text>
    <rect x="640" y="274" width="270" height="30" rx="4" fill="none" stroke="#2a4a66" />
    <text x="775" y="293" fill="#c8d8f0" text-anchor="middle">SIGN IN WITH ENTRA ID</text>
</svg>
