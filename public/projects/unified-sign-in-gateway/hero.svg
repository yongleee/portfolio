<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5">
    <!-- Hero: the username-first login on desktop (username step) and on a phone (local-password step), plus a route-decision panel. Wireframe only: no real data or branding. -->
    <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0v24" fill="none" stroke="#0d2133" />
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#00eeff" stop-opacity=".12" />
            <stop offset="1" stop-color="#00eeff" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
        <clipPath id="screen">
            <rect x="1214" y="104" width="252" height="532" rx="26" />
        </clipPath>
        <g id="mark">
            <path d="M0 -26l23 13v26L0 26l-23-13v-26z" fill="none" stroke="#00eeff" stroke-width="2" />
            <circle r="8" fill="#00eeff" fill-opacity=".8" />
        </g>
        <g id="avatar">
            <circle r="20" fill="#0d2133" stroke="#2a4a66" />
            <circle cy="-6" r="7" fill="#2a4a66" />
            <path d="M-13 12a13 9 0 0 1 26 0" fill="#2a4a66" />
        </g>
    </defs>

    <rect width="1600" height="700" fill="#07111c" />
    <rect width="1600" height="700" fill="url(#grid)" />
    <ellipse cx="640" cy="360" rx="700" ry="360" fill="url(#glow)" />

    <!-- desktop browser -->
    <g filter="url(#shadow)">
        <rect x="70" y="60" width="1060" height="580" rx="10" fill="#07111c" stroke="#16324a" />
    </g>
    <path d="M70 70a10 10 0 0 1 10-10h1040a10 10 0 0 1 10 10v22H70z" fill="#0d2133" />
    <rect x="70" y="92" width="1060" height="1" fill="#16324a" />
    <circle cx="92" cy="76" r="5" fill="#ff0066" fill-opacity=".7" />
    <circle cx="110" cy="76" r="5" fill="#ffb020" fill-opacity=".7" />
    <circle cx="128" cy="76" r="5" fill="#2a4a66" />
    <rect x="420" y="67" width="360" height="18" rx="9" fill="#07111c" stroke="#16324a" />
    <rect x="80" y="93" width="1040" height="537" fill="url(#grid)" opacity=".6" />

    <!-- login card -->
    <rect x="230" y="170" width="740" height="360" rx="10" fill="#0a1724" stroke="#16324a" />
    <use href="#mark" x="300" y="246" />
    <rect x="344" y="232" width="170" height="16" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="344" y="256" width="110" height="8" rx="2" fill="#2a4a66" />
    <rect x="276" y="306" width="250" height="8" rx="2" fill="#1b3550" />
    <rect x="276" y="322" width="210" height="8" rx="2" fill="#1b3550" />
    <rect x="276" y="338" width="230" height="8" rx="2" fill="#1b3550" />
    <use href="#avatar" x="298" y="452" />
    <rect x="330" y="436" width="180" height="32" rx="16" fill="#0d2133" stroke="#16324a" />
    <rect x="346" y="449" width="130" height="7" rx="2" fill="#2a4a66" />

    <rect x="600" y="200" width="1" height="300" fill="#14304a" />

    <rect x="640" y="214" width="170" height="14" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="640" y="240" width="230" height="8" rx="2" fill="#2a4a66" />
    <text x="640" y="286" font-size="9" fill="#4a6a88">USERNAME</text>
    <rect x="640" y="296" width="290" height="40" rx="4" fill="#07111c" stroke="#00eeff" stroke-opacity=".8" />
    <rect x="656" y="312" width="120" height="9" rx="2" fill="#c8d8f0" fill-opacity=".7" />
    <rect x="782" y="306" width="2" height="20" fill="#00eeff" />
    <rect x="640" y="356" width="290" height="40" rx="4" fill="#00eeff" />
    <text x="785" y="380" fill="#07111c" font-weight="bold" text-anchor="middle">LOGIN</text>
    <rect x="640" y="424" width="120" height="1" fill="#16324a" />
    <text x="785" y="428" font-size="9" fill="#4a6a88" text-anchor="middle">OR</text>
    <rect x="810" y="424" width="120" height="1" fill="#16324a" />
    <rect x="640" y="448" width="290" height="38" rx="4" fill="none" stroke="#2a4a66" />
    <text x="785" y="471" fill="#c8d8f0" text-anchor="middle">SIGN IN WITH ENTRA ID</text>

    <rect x="520" y="580" width="160" height="7" rx="2" fill="#14304a" />

    <!-- floating route-decision panel -->
    <g filter="url(#shadow)">
        <rect x="900" y="520" width="270" height="130" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
    </g>
    <rect x="900" y="520" width="270" height="20" fill="#00eeff" />
    <text x="912" y="534" font-size="9" fill="#07111c" font-weight="bold">ROUTE // DECISION</text>
    <circle cx="1156" cy="530" r="4" fill="#ff0066" />
    <g font-size="9" fill="#4a6a88">
        <text x="914" y="564">MODE</text>
        <text x="914" y="592">GRAPH</text>
        <text x="914" y="620">TARGET</text>
    </g>
    <rect x="990" y="557" width="90" height="7" rx="2" fill="#2a4a66" />
    <rect x="990" y="580" width="78" height="16" rx="8" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="1029" y="592" font-size="8" fill="#00eeff" text-anchor="middle">EXISTS</text>
    <text x="990" y="620" font-size="9" fill="#c8d8f0">ENTRA ID</text>
    <path d="M1066 616h20" stroke="#00eeff" stroke-width="1.5" />
    <path d="M1082 612l6 4-6 4z" fill="#00eeff" />

    <!-- phone -->
    <g filter="url(#shadow)">
        <rect x="1200" y="90" width="280" height="560" rx="36" fill="#0d2133" stroke="#2a4a66" />
    </g>
    <g clip-path="url(#screen)">
        <rect x="1214" y="104" width="252" height="532" fill="#07111c" />
        <rect x="1214" y="104" width="252" height="532" fill="url(#grid)" opacity=".6" />
        <use href="#mark" x="1340" y="184" />
        <rect x="1275" y="228" width="130" height="12" rx="2" fill="#c8d8f0" fill-opacity=".85" />
        <rect x="1295" y="248" width="90" height="7" rx="2" fill="#2a4a66" />

        <text x="1234" y="292" font-size="9" fill="#4a6a88">USERNAME</text>
        <rect x="1234" y="300" width="212" height="36" rx="4" fill="#07111c" stroke="#2a4a66" />
        <rect x="1248" y="314" width="90" height="8" rx="2" fill="#c8d8f0" fill-opacity=".7" />
        <text x="1234" y="358" font-size="9" fill="#4a6a88">PASSWORD</text>
        <rect x="1234" y="366" width="212" height="36" rx="4" fill="#07111c" stroke="#00eeff" stroke-opacity=".8" />
        <g fill="#c8d8f0" fill-opacity=".7">
            <circle cx="1252" cy="384" r="3" /><circle cx="1264" cy="384" r="3" /><circle cx="1276" cy="384" r="3" />
            <circle cx="1288" cy="384" r="3" /><circle cx="1300" cy="384" r="3" />
        </g>
        <rect x="1234" y="422" width="212" height="38" rx="4" fill="#00eeff" />
        <text x="1340" y="445" fill="#07111c" font-weight="bold" text-anchor="middle">LOGIN</text>
        <rect x="1234" y="474" width="212" height="36" rx="4" fill="none" stroke="#2a4a66" />
        <text x="1340" y="496" font-size="9" fill="#c8d8f0" text-anchor="middle">SIGN IN WITH ENTRA ID</text>

        <use href="#avatar" x="1254" y="580" />
        <rect x="1282" y="566" width="160" height="28" rx="14" fill="#0d2133" stroke="#16324a" />
        <rect x="1296" y="577" width="110" height="6" rx="2" fill="#2a4a66" />
    </g>
    <rect x="1305" y="114" width="70" height="6" rx="3" fill="#0d2133" />

    <text x="70" y="678" font-size="9" fill="#2a4a66">SYS.VIEW // ONE PAGE · USERNAME FIRST · ENTRA ID OR LOCAL PASSWORD</text>
</svg>
