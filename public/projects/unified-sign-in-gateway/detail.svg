<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Detail: the single-session enforcer screen that lists the user's other session and lets them end it or back out. Wireframe only: no real data. -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0v20" fill="none" stroke="#0d2133" />
        </pattern>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
    </defs>

    <rect width="800" height="500" fill="#07111c" />
    <rect width="800" height="500" fill="url(#grid)" />

    <!-- window -->
    <g filter="url(#shadow)">
        <rect x="40" y="30" width="720" height="440" rx="8" fill="#07111c" stroke="#16324a" />
    </g>
    <path d="M40 38a8 8 0 0 1 8-8h704a8 8 0 0 1 8 8v24H40z" fill="#0d2133" />
    <rect x="40" y="62" width="720" height="1" fill="#16324a" />
    <circle cx="60" cy="46" r="4" fill="#ff0066" fill-opacity=".7" />
    <circle cx="74" cy="46" r="4" fill="#ffb020" fill-opacity=".7" />
    <circle cx="88" cy="46" r="4" fill="#2a4a66" />
    <rect x="260" y="38" width="280" height="16" rx="8" fill="#07111c" stroke="#16324a" />

    <!-- card -->
    <rect x="80" y="88" width="640" height="356" rx="8" fill="#0a1724" stroke="#16324a" />

    <!-- logo section -->
    <path d="M150 140l22 13v26l-22 13-22-13v-26z" fill="none" stroke="#00eeff" stroke-width="2" />
    <circle cx="150" cy="166" r="7" fill="#00eeff" fill-opacity=".8" />
    <rect x="186" y="156" width="110" height="12" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="186" y="176" width="70" height="7" rx="2" fill="#2a4a66" />
    <rect x="128" y="230" width="180" height="7" rx="2" fill="#1b3550" />
    <rect x="128" y="244" width="150" height="7" rx="2" fill="#1b3550" />
    <rect x="128" y="258" width="164" height="7" rx="2" fill="#1b3550" />

    <rect x="340" y="112" width="1" height="308" fill="#14304a" />

    <!-- conflict form -->
    <circle cx="384" cy="122" r="10" fill="#ff0066" fill-opacity=".15" stroke="#ff0066" />
    <rect x="383" y="115" width="2" height="9" fill="#ff0066" />
    <rect x="383" y="127" width="2" height="2" fill="#ff0066" />
    <rect x="404" y="116" width="200" height="12" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="374" y="144" width="300" height="7" rx="2" fill="#2a4a66" />
    <rect x="374" y="157" width="220" height="7" rx="2" fill="#2a4a66" />

    <!-- session card -->
    <rect x="374" y="178" width="316" height="132" rx="6" fill="#07111c" stroke="#2a4a66" />
    <rect x="584" y="186" width="96" height="16" rx="8" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
    <text x="632" y="197" font-size="8" fill="#ff0066" text-anchor="middle">ACTIVE</text>
    <g fill="#4a6a88">
        <text x="390" y="200">DEVICE</text>
        <text x="390" y="230">IP ADDRESS</text>
        <text x="390" y="260">SIGNED IN</text>
        <text x="390" y="290">LAST ACTIVE</text>
    </g>
    <g fill="#14304a">
        <rect x="386" y="212" width="292" height="1" />
        <rect x="386" y="242" width="292" height="1" />
        <rect x="386" y="272" width="292" height="1" />
    </g>
    <rect x="502" y="223" width="96" height="7" rx="2" fill="#c8d8f0" fill-opacity=".7" />
    <rect x="502" y="253" width="120" height="7" rx="2" fill="#c8d8f0" fill-opacity=".7" />
    <rect x="502" y="283" width="84" height="7" rx="2" fill="#c8d8f0" fill-opacity=".7" />
    <rect x="502" y="193" width="66" height="7" rx="2" fill="#c8d8f0" fill-opacity=".7" />

    <!-- choices -->
    <rect x="374" y="326" width="316" height="36" rx="4" fill="#00eeff" />
    <text x="532" y="348" font-size="10" fill="#07111c" font-weight="bold" text-anchor="middle">LOG IN HERE · END OTHERS</text>
    <rect x="374" y="374" width="316" height="36" rx="4" fill="none" stroke="#2a4a66" />
    <text x="532" y="396" font-size="10" fill="#c8d8f0" text-anchor="middle">STAY ON EXISTING DEVICE</text>

    <!-- annotations -->
    <g fill="#4a6a88" font-size="8">
        <text x="128" y="345">END → REMOVE SESSIONS</text>
        <text x="128" y="393">STAY → BACK TO LOGIN</text>
    </g>
    <g fill="none" stroke="#4a6a88" stroke-dasharray="3 3">
        <path d="M300 342H366" />
        <path d="M300 390H366" />
    </g>

    <text x="40" y="490" fill="#2a4a66">SESSION CONFLICT // LOCAL + ENTRA LOGINS · DEVICE PARSED FROM USER AGENT</text>
</svg>
