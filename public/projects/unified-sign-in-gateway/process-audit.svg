<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1">
    <!-- Process sketch: one brokered login reconstructed from JSON audit events that share a session ID. Wireframe only: no real log data. -->
    <rect width="400" height="300" fill="#07111c" />

    <rect x="12" y="20" width="376" height="246" fill="#0a1724" stroke="#16324a" />
    <rect x="12" y="20" width="376" height="18" fill="#00eeff" />
    <text x="22" y="33" font-size="8" fill="#07111c" font-weight="bold">AUDIT // JSON</text>
    <text x="378" y="33" font-size="8" fill="#07111c" font-weight="bold" text-anchor="end">GREP SESSION ID</text>

    <g fill="#4a6a88">
        <text x="24" y="66">ROUTE_DECISION</text>
        <text x="24" y="98">GRAPH_LOOKUP</text>
        <text x="24" y="130">ENTRA_REDIRECT</text>
        <text x="24" y="162">ENTRA_CALLBACK</text>
        <text x="24" y="194">SESSION_CONFLICT</text>
    </g>
    <text x="24" y="226" fill="#00eeff">LOGIN</text>
    <rect x="70" y="217" width="52" height="12" rx="6" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="96" y="226" font-size="7" fill="#00eeff" text-anchor="middle">FINAL</text>

    <g fill="#00eeff">
        <rect x="140" y="60" width="64" height="7" rx="2" />
        <rect x="140" y="92" width="64" height="7" rx="2" />
        <rect x="140" y="124" width="64" height="7" rx="2" />
        <rect x="140" y="156" width="64" height="7" rx="2" />
        <rect x="140" y="188" width="64" height="7" rx="2" />
        <rect x="140" y="220" width="64" height="7" rx="2" />
    </g>
    <g fill="#2a4a66">
        <rect x="216" y="60" width="110" height="7" rx="2" />
        <rect x="216" y="92" width="70" height="7" rx="2" />
        <rect x="216" y="124" width="130" height="7" rx="2" />
        <rect x="216" y="156" width="96" height="7" rx="2" />
        <rect x="216" y="188" width="120" height="7" rx="2" />
        <rect x="216" y="220" width="84" height="7" rx="2" />
    </g>
    <rect x="296" y="89" width="62" height="13" rx="6" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-opacity=".6" />
    <text x="327" y="98" font-size="7" fill="#ffb020" text-anchor="middle">DETAIL</text>
    <rect x="314" y="217" width="32" height="13" rx="6" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
    <text x="330" y="226" font-size="7" fill="#ff0066" text-anchor="middle">VPN</text>

    <g fill="#14304a">
        <rect x="20" y="78" width="360" height="1" />
        <rect x="20" y="110" width="360" height="1" />
        <rect x="20" y="142" width="360" height="1" />
        <rect x="20" y="174" width="360" height="1" />
        <rect x="20" y="206" width="360" height="1" />
    </g>
    <rect x="24" y="248" width="150" height="6" rx="2" fill="#1b3550" />

    <text x="12" y="288" font-size="8" fill="#2a4a66">13 EVENT TYPES · IP + VPN TAGS · ONE SESSION ID</text>
</svg>
