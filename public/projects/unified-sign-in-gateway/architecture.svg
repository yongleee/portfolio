<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <!-- System diagram: browser and service clients, the Keycloak instance with the custom SPI JAR, and the services it talks to. Generic components only. -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0v20" fill="none" stroke="#0d2133" />
        </pattern>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#00eeff" />
        </marker>
        <marker id="arrow-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#4a6a88" />
        </marker>
        <g id="layer">
            <rect width="260" height="40" fill="#0b1a28" stroke="#2a4a66" />
        </g>
        <g id="upstream">
            <rect width="190" height="60" fill="#0b1a28" stroke="#2a4a66" />
        </g>
    </defs>

    <rect width="800" height="500" fill="#07111c" />
    <rect width="800" height="500" fill="url(#grid)" />

    <!-- clients -->
    <rect x="30" y="100" width="150" height="70" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
    <rect x="30" y="100" width="150" height="18" fill="#00eeff" />
    <text x="40" y="113" font-size="9" fill="#07111c" font-weight="bold">CLIENT // BROWSER</text>
    <text x="40" y="142" fill="#c8d8f0">STAFF LOGIN</text>
    <text x="40" y="158" font-size="9" fill="#4a6a88">DESKTOP · MOBILE</text>

    <rect x="30" y="360" width="150" height="60" fill="#0b1a28" stroke="#2a4a66" />
    <text x="40" y="384" fill="#c8d8f0">APP SERVICES</text>
    <text x="40" y="400" font-size="9" fill="#4a6a88">BEARER · AZP CHECK</text>

    <!-- core -->
    <rect x="220" y="40" width="300" height="420" fill="#0d2133" stroke="#00eeff" stroke-width="2" />
    <rect x="220" y="40" width="300" height="18" fill="#00eeff" />
    <text x="230" y="53" font-size="9" fill="#07111c" font-weight="bold">CORE // KEYCLOAK 26</text>
    <text x="512" y="53" font-size="9" fill="#07111c" font-weight="bold" text-anchor="end">SPI JAR</text>

    <!-- links -->
    <g fill="none" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M180 135H200V150H236" />
        <path d="M500 150H576" />
        <path d="M540 150V70H576" />
        <path d="M500 210H550V240H576" />
        <path d="M500 330H576" />
        <path d="M180 390H236" />
    </g>
    <g fill="none" stroke="#4a6a88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dim)">
        <path d="M580 420H524" />
    </g>

    <use href="#layer" x="240" y="70" />
    <text x="252" y="87" fill="#c8d8f0">LOGIN THEME</text>
    <text x="252" y="101" font-size="9" fill="#4a6a88">7 FTL TEMPLATES · MOBILE CSS</text>

    <use href="#layer" x="240" y="130" />
    <text x="252" y="147" fill="#c8d8f0">AUTHENTICATORS × 8</text>
    <text x="252" y="161" font-size="9" fill="#4a6a88">ROUTE · REDIRECT · 1 SESSION</text>
    <circle cx="488" cy="140" r="4" fill="#ff0066" />

    <use href="#layer" x="240" y="190" />
    <text x="252" y="207" fill="#c8d8f0">BROKER</text>
    <text x="252" y="221" font-size="9" fill="#4a6a88">SILENT SSO IDP · MAPPER</text>

    <use href="#layer" x="240" y="250" />
    <text x="252" y="267" fill="#c8d8f0">PASSWORD POLICY</text>
    <text x="252" y="281" font-size="9" fill="#4a6a88">MINIMUM PASSWORD AGE</text>

    <use href="#layer" x="240" y="310" />
    <text x="252" y="327" fill="#c8d8f0">AUDIT LISTENER</text>
    <text x="252" y="341" font-size="9" fill="#4a6a88">13 EVENT TYPES · IP + VPN</text>

    <use href="#layer" x="240" y="370" />
    <text x="252" y="387" fill="#c8d8f0">MGMT REST API</text>
    <text x="252" y="401" font-size="9" fill="#4a6a88">USERS + ROLES · GROUP-FENCED</text>

    <text x="240" y="440" font-size="9" fill="#4a6a88">13 PROVIDERS · 6 SPI TYPES</text>

    <!-- upstreams -->
    <use href="#upstream" x="580" y="40" />
    <text x="592" y="64" fill="#c8d8f0">ENTRA ID</text>
    <text x="592" y="80" font-size="9" fill="#4a6a88">OIDC · STAFF ACCOUNTS</text>

    <use href="#upstream" x="580" y="120" />
    <text x="592" y="144" fill="#c8d8f0">MICROSOFT GRAPH</text>
    <text x="592" y="160" font-size="9" fill="#4a6a88">USER LOOKUP · CACHED</text>

    <use href="#upstream" x="580" y="210" />
    <text x="592" y="234" fill="#c8d8f0">KEYCLOAK // APP B</text>
    <text x="592" y="250" font-size="9" fill="#4a6a88">SILENT SSO IDP</text>

    <use href="#upstream" x="580" y="300" />
    <text x="592" y="324" fill="#c8d8f0">AUDIT LOG</text>
    <text x="592" y="340" font-size="9" fill="#4a6a88">JSON · BY SESSION ID</text>

    <rect x="580" y="390" width="190" height="60" fill="#0b1a28" stroke="#2a4a66" stroke-dasharray="4 3" />
    <text x="592" y="414" fill="#c8d8f0">GITLAB CI</text>
    <text x="592" y="430" font-size="9" fill="#4a6a88">JAR → 2 PROD VMS</text>

    <text x="30" y="492" font-size="9" fill="#2a4a66">SYS.MAP // JAVA 17 · DOCKER DEV · SYSTEMD IN PRODUCTION</text>
</svg>
