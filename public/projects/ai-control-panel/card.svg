    <rect x="804" y="138" width="372" height="202" rx="4" fill="#0b1a28" stroke="#16324a" />
    <text x="820" y="160" fill="#4a6a88">TOP API KEYS</text>
    <use href="#toprow" x="820" y="186" />
    <use href="#toprow" x="820" y="216" />
    <use href="#toprow" x="820" y="246" />
    <use href="#toprow" x="820" y="276" />
    <use href="#toprow" x="820" y="306" />
    <g>
        <rect x="1000" y="186" width="150" height="7" rx="3" fill="#00eeff" />
        <rect x="1000" y="216" width="112" height="7" rx="3" fill="#00eeff" fill-opacity=".8" />
        <rect x="1000" y="246" width="84" height="7" rx="3" fill="#00eeff" fill-opacity=".65" />
        <rect x="1000" y="276" width="58" height="7" rx="3" fill="#00eeff" fill-opacity=".5" />
        <rect x="1000" y="306" width="30" height="7" rx="3" fill="#00eeff" fill-opacity=".35" />
