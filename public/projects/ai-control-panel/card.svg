    <use href="#kpi" x="176" y="60" />
    <use href="#kpi" x="379" y="60" />
    <use href="#kpi" x="582" y="60" />
    <use href="#kpi" x="785" y="60" />
    <use href="#kpi" x="988" y="60" />
    <g fill="#4a6a88">
