        <rect x="724" y="153" width="8" height="8" fill="#ffb020" /><rect x="736" y="155" width="22" height="4" rx="2" />
    </g>
    <g stroke="#14304a" stroke-dasharray="3 4">
        <path d="M192 196H772" />
        <path d="M192 236H772" />
        <path d="M192 276H772" />
    </g>
    <path d="M192 316H772" stroke="#2a4a66" />
    <use href="#sbar" transform="translate(200 316) scale(1 .44)" />
    <use href="#sbar" transform="translate(229 316) scale(1 .52)" />
    <use href="#sbar" transform="translate(258 316) scale(1 .40)" />
    <use href="#sbar" transform="translate(287 316) scale(1 .61)" />
    <use href="#sbar" transform="translate(316 316) scale(1 .58)" />
    <use href="#sbar" transform="translate(345 316) scale(1 .72)" />
    <use href="#sbar" transform="translate(374 316) scale(1 .66)" />
    <use href="#sbar" transform="translate(403 316) scale(1 .50)" />
    <use href="#sbar" transform="translate(432 316) scale(1 .80)" />
    <use href="#sbar" transform="translate(461 316) scale(1 .88)" />
    <use href="#sbar" transform="translate(490 316) scale(1 .76)" />
    <use href="#sbar" transform="translate(519 316) scale(1 .64)" />
    <use href="#sbar" transform="translate(548 316) scale(1 .94)" />
    <use href="#sbar" transform="translate(577 316) scale(1 .86)" />
    <use href="#sbar" transform="translate(606 316) scale(1 .70)" />
    <use href="#sbar" transform="translate(635 316) scale(1 .82)" />
    <use href="#sbar" transform="translate(664 316) scale(1 1)" />
    <use href="#sbar" transform="translate(693 316) scale(1 .92)" />
    <use href="#sbar" transform="translate(722 316) scale(1 1.04)" />
    <use href="#sbar" transform="translate(751 316) scale(1 1.12)" />

