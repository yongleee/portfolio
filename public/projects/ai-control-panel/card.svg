        <text x="393" y="80">REQUESTS</text>
        <text x="596" y="80">TOKENS</text>
        <text x="799" y="80">TOK / REQ</text>
        <text x="1002" y="80">$ / 1M TOK</text>
    </g>
    <g fill="none" stroke="#00eeff" stroke-width="1.5">
        <path d="M290 108l12-6 12 3 12-9 12 4 12-10 12 2" />
        <path d="M493 106l12-2 12-7 12 5 12-6 12-3 12-5" />
        <path d="M696 108l12-8 12 4 12-3 12-7 12 2 12-6" />
        <path d="M899 100l12 4 12-2 12 3 12-4 12 1 12-2" />
        <path d="M1102 98l12 3 12-1 12 4 12 2 12-3 12 4" />
    </g>

