<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Work-log card: wide crop of the usage dashboard (KPI tiles, spend by model, top keys). Wireframe only: no real data. -->
    <defs>
        <!-- one stacked bar, 100 units tall from the baseline; scaled per bar -->
        <g id="sbar">
            <rect y="-50" width="17" height="50" fill="#00eeff" />
            <rect y="-80" width="17" height="30" fill="#7c8cff" />
            <rect y="-92" width="17" height="12" fill="#ffb020" />
            <rect y="-100" width="17" height="8" fill="#4a6a88" />
        </g>
        <g id="kpi">
            <rect width="188" height="62" rx="4" fill="#0b1a28" stroke="#16324a" />
            <rect x="14" y="32" width="84" height="14" rx="2" fill="#c8d8f0" fill-opacity=".85" />
        </g>
        <g id="toprow">
            <rect width="140" height="7" rx="2" fill="#2a4a66" />
            <rect x="180" width="150" height="7" rx="3" fill="#14304a" />
        </g>
    </defs>

    <rect width="1200" height="352" fill="#07111c" />

    <!-- sidebar -->
    <rect width="150" height="352" fill="#0a1724" />
    <rect x="150" width="1" height="352" fill="#14304a" />
    <rect x="20" y="16" width="22" height="22" rx="4" fill="#00eeff" />
    <rect x="52" y="23" width="70" height="8" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <g fill="#1b3550">
        <rect x="20" y="70" width="12" height="12" rx="2" /><rect x="42" y="72" width="64" height="8" rx="2" />
        <rect x="20" y="102" width="12" height="12" rx="2" /><rect x="42" y="104" width="78" height="8" rx="2" />
        <rect x="20" y="134" width="12" height="12" rx="2" /><rect x="42" y="136" width="56" height="8" rx="2" />
        <rect x="20" y="166" width="12" height="12" rx="2" /><rect x="42" y="168" width="60" height="8" rx="2" />
        <rect x="20" y="230" width="12" height="12" rx="2" /><rect x="42" y="232" width="58" height="8" rx="2" />
    </g>
    <rect x="10" y="190" width="130" height="28" rx="4" fill="#00eeff" fill-opacity=".12" />
    <rect x="20" y="198" width="12" height="12" rx="2" fill="#00eeff" />
    <rect x="42" y="200" width="66" height="8" rx="2" fill="#00eeff" />

    <!-- top bar -->
    <rect x="151" width="1049" height="44" fill="#07111c" />
    <rect x="151" y="44" width="1049" height="1" fill="#14304a" />
    <rect x="176" y="18" width="64" height="8" rx="2" fill="#2a4a66" />
    <text x="250" y="25" fill="#4a6a88">/</text>
    <rect x="264" y="18" width="52" height="8" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="964" y="11" width="212" height="22" rx="4" fill="#0b1a28" stroke="#2a4a66" />
    <rect x="976" y="16" width="12" height="12" rx="2" fill="none" stroke="#00eeff" />
    <path d="M976 20h12" stroke="#00eeff" />
    <rect x="998" y="18" width="150" height="8" rx="2" fill="#2a4a66" />

