<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <!-- High-level system diagram: browser, the Next.js server layers, five upstreams. Generic components only. -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0v20" fill="none" stroke="#0d2133" />
        </pattern>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#00eeff" />
        </marker>
        <marker id="arrow-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#4a6a88" />
        </marker>
        <g id="layer">
            <rect width="210" height="40" fill="#0b1a28" stroke="#2a4a66" />
        </g>
        <g id="upstream">
            <rect width="200" height="60" fill="#0b1a28" stroke="#2a4a66" />
        </g>
    </defs>

    <rect width="800" height="500" fill="#07111c" />
    <rect width="800" height="500" fill="url(#grid)" />

    <!-- client -->
    <rect x="30" y="200" width="150" height="80" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
    <rect x="30" y="200" width="150" height="18" fill="#00eeff" />
    <text x="40" y="213" font-size="9" fill="#07111c" font-weight="bold">CLIENT // BROWSER</text>
    <text x="40" y="244" fill="#c8d8f0">OPERATOR UI</text>
    <text x="40" y="260" font-size="9" fill="#4a6a88">REACT 19 · QUERY</text>

    <!-- core -->
    <rect x="240" y="60" width="250" height="380" fill="#0d2133" stroke="#00eeff" stroke-width="2" />
    <rect x="240" y="60" width="250" height="18" fill="#00eeff" />
    <text x="250" y="73" font-size="9" fill="#07111c" font-weight="bold">CORE // NEXT.JS 16</text>
    <text x="482" y="73" font-size="9" fill="#07111c" font-weight="bold" text-anchor="end">SERVER-ONLY</text>

    <!-- links: drawn over the core panel so the in-box arrows show, under its layers -->
    <g fill="none" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M180 220H220V130H256" />
        <path d="M365 150v16" />
        <path d="M365 210v16" />
        <path d="M365 270v16" />
        <path d="M470 310H520V70H556" />
        <path d="M520 310V158H556" />
        <path d="M520 310V246H556" />
        <path d="M520 310V334H556" />
        <path d="M520 310V422H556" />
    </g>
    <g fill="none" stroke="#4a6a88" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dim)">
        <path d="M260 370H250V250H256" />
        <path d="M260 384H140V284" />
        <path d="M80 280V474H660V456" />
    </g>
    <g fill="#4a6a88" font-size="9">
        <text x="214" y="175" text-anchor="end">POLL 10S</text>
        <text x="150" y="378">SSR SNAPSHOT</text>
        <text x="90" y="468">OIDC LOGIN</text>
    </g>

    <use href="#layer" x="260" y="110" />
    <text x="270" y="127" fill="#c8d8f0">ROUTE HANDLER</text>
    <text x="270" y="141" font-size="9" fill="#4a6a88">ROUTE.TS · 48 ROUTES</text>

    <use href="#layer" x="260" y="170" />
    <text x="270" y="187" fill="#c8d8f0">CONTROLLER</text>
    <text x="270" y="201" font-size="9" fill="#4a6a88">PARSE · STATUS CODES</text>

    <use href="#layer" x="260" y="230" />
    <text x="270" y="247" fill="#c8d8f0">SERVICE</text>
    <text x="270" y="261" font-size="9" fill="#4a6a88">5S TTL CACHE · UNITS</text>

    <use href="#layer" x="260" y="290" />
    <text x="270" y="307" fill="#c8d8f0">CLIENT</text>
    <text x="270" y="321" font-size="9" fill="#4a6a88">TIMEOUT · ERROR WRAP</text>
    <circle cx="460" cy="300" r="4" fill="#ff0066" />

    <rect x="260" y="350" width="210" height="40" fill="#0b1a28" stroke="#2a4a66" stroke-dasharray="4 3" />
    <text x="270" y="367" fill="#c8d8f0">SSR PAGES</text>
    <text x="270" y="381" font-size="9" fill="#4a6a88">CALL SERVICE DIRECTLY</text>

    <text x="260" y="420" font-size="9" fill="#4a6a88">SECRETS + TOKENS STAY HERE</text>

    <!-- upstreams -->
    <use href="#upstream" x="560" y="40" />
    <text x="572" y="60" fill="#c8d8f0">AI GATEWAY</text>
    <text x="572" y="76" font-size="9" fill="#4a6a88">GO · OPENAI-COMPATIBLE</text>
    <text x="572" y="90" font-size="9" fill="#4a6a88">9 PROVIDER TYPES</text>

    <use href="#upstream" x="560" y="128" />
    <text x="572" y="152" fill="#c8d8f0">LOCAL LLM ENGINE</text>
    <text x="572" y="168" font-size="9" fill="#4a6a88">MODELS · HF · GPU</text>

    <use href="#upstream" x="560" y="216" />
    <text x="572" y="240" fill="#c8d8f0">RANCHER API</text>
    <text x="572" y="256" font-size="9" fill="#4a6a88">NODES · PODS · EVENTS</text>

    <use href="#upstream" x="560" y="304" />
    <text x="572" y="328" fill="#c8d8f0">DCGM EXPORTER</text>
    <text x="572" y="344" font-size="9" fill="#4a6a88">PROMETHEUS · GPU · MIG</text>

    <use href="#upstream" x="560" y="392" />
    <text x="572" y="416" fill="#c8d8f0">KEYCLOAK</text>
    <text x="572" y="432" font-size="9" fill="#4a6a88">OIDC · JWKS</text>

    <text x="30" y="492" font-size="9" fill="#2a4a66">SYS.MAP // DOCKER · GITLAB CI: LINT / TYPECHECK / BUILD</text>
</svg>
