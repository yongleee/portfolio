<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Work-log card: wide crop of the broadband subscriber list with search, status pills and pagination. Wireframe only: no real data or branding. -->
    <defs>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#14304a" />
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#00eeff" stop-opacity=".1" />
            <stop offset="1" stop-color="#00eeff" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
        <g id="row">
            <rect width="700" height="30" fill="#0a1724" />
            <rect y="29" width="700" height="1" fill="#14304a" />
            <rect x="16" y="11" width="110" height="8" rx="2" fill="#c8d8f0" fill-opacity=".7" />
            <rect x="196" y="11" width="130" height="8" rx="2" fill="#2a4a66" />
            <rect x="396" y="11" width="90" height="8" rx="2" fill="#2a4a66" />
            <rect x="620" y="11" width="60" height="8" rx="2" fill="#1b3550" />
        </g>
        <g id="ok">
            <rect width="70" height="16" rx="8" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
            <rect x="14" y="5" width="42" height="6" rx="2" fill="#00eeff" />
        </g>
        <g id="off">
            <rect width="70" height="16" rx="8" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-opacity=".6" />
            <rect x="14" y="5" width="42" height="6" rx="2" fill="#ffb020" />
        </g>
    </defs>

    <rect width="1200" height="352" fill="#07111c" />
    <rect width="1200" height="352" fill="url(#dots)" />
    <ellipse cx="600" cy="176" rx="520" ry="220" fill="url(#glow)" />

    <!-- app window -->
    <rect x="150" y="24" width="900" height="340" rx="8" fill="#0a1724" stroke="#16324a" filter="url(#shadow)" />

    <!-- sidebar -->
    <rect x="150" y="24" width="140" height="340" rx="8" fill="#0b1a28" />
    <rect x="282" y="24" width="8" height="340" fill="#0b1a28" />
    <rect x="289" y="24" width="1" height="340" fill="#14304a" />
    <rect x="168" y="44" width="22" height="22" rx="4" fill="none" stroke="#00eeff" stroke-width="2" />
    <rect x="198" y="51" width="70" height="8" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <g fill="#1b3550">
        <rect x="168" y="94" width="80" height="7" rx="2" />
        <rect x="168" y="152" width="70" height="7" rx="2" />
        <rect x="168" y="178" width="88" height="7" rx="2" />
        <rect x="168" y="204" width="64" height="7" rx="2" />
        <rect x="168" y="230" width="76" height="7" rx="2" />
    </g>
    <rect x="160" y="114" width="122" height="24" rx="4" fill="#00eeff" fill-opacity=".12" />
    <rect x="160" y="114" width="3" height="24" fill="#00eeff" />
    <text x="170" y="129" fill="#00eeff">BROADBANDS</text>

    <!-- header + search -->
    <rect x="320" y="46" width="150" height="14" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <rect x="320" y="68" width="220" height="7" rx="2" fill="#2a4a66" />
    <rect x="320" y="92" width="380" height="30" rx="4" fill="#07111c" stroke="#00eeff" stroke-opacity=".8" />
    <circle cx="338" cy="107" r="6" fill="none" stroke="#4a6a88" stroke-width="1.5" />
    <path d="M342.5 111.5l4 4" stroke="#4a6a88" stroke-width="1.5" />
    <text x="356" y="111" fill="#4a6a88">SEARCH</text>
    <rect x="420" y="103" width="2" height="10" fill="#00eeff" />
    <rect x="910" y="92" width="110" height="30" rx="4" fill="#00eeff" />
    <text x="965" y="111" fill="#07111c" font-weight="bold" text-anchor="middle">+ ADD</text>

    <!-- table -->
    <g transform="translate(320 136)">
        <rect width="700" height="26" fill="#0d2133" />
        <g fill="#4a6a88">
            <text x="16" y="17">MODEM ID</text>
            <text x="196" y="17">PACKAGE</text>
            <text x="396" y="17">VOIP</text>
            <text x="520" y="17">STATUS</text>
        </g>
    </g>
    <svg x="320" y="162" width="700" height="190" overflow="hidden">
        <use href="#row" y="0" />
        <use href="#row" y="30" />
        <use href="#row" y="60" />
        <use href="#row" y="90" />
        <use href="#row" y="120" />
        <use href="#row" y="150" />
        <use href="#ok" x="520" y="7" />
        <use href="#ok" x="520" y="37" />
        <use href="#off" x="520" y="67" />
        <use href="#ok" x="520" y="97" />
        <use href="#ok" x="520" y="127" />
        <use href="#off" x="520" y="157" />
    </svg>

    <!-- side HUD: access mode and scope, decoration in the crop zone -->
    <g fill="#4a6a88">
        <text x="20" y="130">ACCESS</text>
        <text x="20" y="210">SCOPE</text>
    </g>
    <rect x="20" y="140" width="110" height="22" rx="11" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="34" y="155" fill="#00eeff">BROWSE</text>
    <rect x="20" y="220" width="110" height="22" rx="11" fill="#7c8cff" fill-opacity=".12" stroke="#7c8cff" stroke-opacity=".6" />
    <rect x="34" y="228" width="70" height="6" rx="2" fill="#7c8cff" />
    <rect x="1070" y="140" width="110" height="22" rx="11" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
    <circle cx="1086" cy="151" r="4" fill="#ff0066" />
    <rect x="1098" y="148" width="66" height="6" rx="2" fill="#ff0066" fill-opacity=".8" />
    <rect x="1070" y="178" width="96" height="6" rx="2" fill="#1b3550" />
    <rect x="1070" y="194" width="70" height="6" rx="2" fill="#1b3550" />
</svg>
