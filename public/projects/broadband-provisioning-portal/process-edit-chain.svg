<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" letter-spacing="1">
    <!-- Process: a broadband edit becomes one provisioning call per changed field, username last; the chain stops at the first refusal and reports what was applied. Wireframe only: no real data. -->
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0l10 5-10 5z" fill="#00eeff" />
        </marker>
    </defs>

    <rect width="400" height="300" fill="#07111c" />

    <text x="20" y="26" fill="#4a6a88" font-size="9" letter-spacing="2">EDIT = CALL CHAIN</text>

    <!-- diff -->
    <rect x="20" y="40" width="112" height="128" rx="5" fill="#0a1724" stroke="#16324a" />
    <text x="32" y="58" fill="#c8d8f0">CHANGED</text>
    <text x="32" y="72" fill="#4a6a88">vs live values</text>
    <g fill="#4a6a88">
        <text x="32" y="96">IP</text>
        <text x="32" y="114">PASSWORD</text>
        <text x="32" y="132">SERVICE</text>
        <text x="32" y="150">USERNAME</text>
    </g>
    <g fill="#00eeff">
        <circle cx="120" cy="93" r="3" />
        <circle cx="120" cy="111" r="3" />
        <circle cx="120" cy="129" r="3" />
        <circle cx="120" cy="147" r="3" />
    </g>

    <path d="M132 104h26" stroke="#00eeff" marker-end="url(#arr)" />

    <!-- chain -->
    <g>
        <rect x="164" y="40" width="216" height="28" rx="4" fill="#0d2133" stroke="#00eeff" stroke-opacity=".6" />
        <text x="176" y="58" fill="#c8d8f0">1 MOD IP</text>
        <rect x="322" y="46" width="48" height="16" rx="8" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
        <text x="346" y="57" fill="#00eeff" text-anchor="middle">OK</text>

        <rect x="164" y="80" width="216" height="28" rx="4" fill="#0d2133" stroke="#00eeff" stroke-opacity=".6" />
        <text x="176" y="98" fill="#c8d8f0">2 MOD PASSWORD</text>
        <rect x="322" y="86" width="48" height="16" rx="8" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
        <text x="346" y="97" fill="#00eeff" text-anchor="middle">OK</text>

        <rect x="164" y="120" width="216" height="28" rx="4" fill="#0d2133" stroke="#ff0066" stroke-opacity=".8" />
        <text x="176" y="138" fill="#c8d8f0">3 MOD SERVICE</text>
        <rect x="310" y="126" width="60" height="16" rx="8" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
        <text x="340" y="137" fill="#ff0066" text-anchor="middle">REFUSED</text>

        <rect x="164" y="160" width="216" height="28" rx="4" fill="none" stroke="#2a4a66" stroke-dasharray="4 3" />
        <text x="176" y="178" fill="#4a6a88">4 RENAME (ALWAYS LAST)</text>
    </g>
    <g stroke="#2a4a66">
        <path d="M184 68v12" />
        <path d="M184 108v12" />
    </g>
    <path d="M184 148v12" stroke="#ff0066" stroke-dasharray="2 3" />
    <path d="M178 151l12 6M190 151l-12 6" stroke="#ff0066" stroke-width="1.5" />

    <!-- result -->
    <path d="M164 134h-14v86" fill="none" stroke="#ff0066" marker-end="url(#arr)" />
    <rect x="20" y="226" width="360" height="56" rx="5" fill="#0a1724" stroke="#ff0066" stroke-opacity=".6" />
    <text x="32" y="244" fill="#ff0066">422  STOP AT FIRST REFUSAL</text>
    <text x="32" y="260" fill="#4a6a88">applied:</text>
    <rect x="96" y="252" width="40" height="12" rx="6" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="116" y="261" fill="#00eeff" text-anchor="middle">IP</text>
    <rect x="142" y="252" width="72" height="12" rx="6" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
    <text x="178" y="261" fill="#00eeff" text-anchor="middle">PASSWORD</text>
    <text x="32" y="274" fill="#4a6a88">activity logged only for OK steps</text>
</svg>
