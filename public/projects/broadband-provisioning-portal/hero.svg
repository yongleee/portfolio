<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Hero: broadband workspace on desktop (persistent account header, section nav, overview cards) and the installer's search-only view on a phone. Wireframe only: no real data or branding. -->
    <defs>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#14304a" />
        </pattern>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#00eeff" stop-opacity=".1" />
            <stop offset="1" stop-color="#00eeff" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
        <clipPath id="phone-screen">
            <rect x="1238" y="132" width="252" height="500" rx="22" />
        </clipPath>
        <g id="kv">
            <rect width="90" height="7" rx="2" fill="#4a6a88" fill-opacity=".7" />
            <rect x="120" width="110" height="7" rx="2" fill="#c8d8f0" fill-opacity=".7" />
        </g>
        <g id="vrow">
            <rect width="790" height="30" fill="#0a1724" />
            <rect y="29" width="790" height="1" fill="#14304a" />
            <rect x="16" y="11" width="100" height="8" rx="2" fill="#c8d8f0" fill-opacity=".7" />
            <rect x="170" y="11" width="120" height="8" rx="2" fill="#2a4a66" />
            <rect x="340" y="11" width="110" height="8" rx="2" fill="#2a4a66" />
        </g>
        <g id="ok">
            <rect width="64" height="16" rx="8" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
            <rect x="12" y="5" width="40" height="6" rx="2" fill="#00eeff" />
        </g>
        <g id="hit">
            <rect width="220" height="58" rx="6" fill="#0a1724" stroke="#16324a" />
            <rect x="14" y="14" width="110" height="9" rx="2" fill="#c8d8f0" fill-opacity=".8" />
            <rect x="14" y="32" width="150" height="6" rx="2" fill="#2a4a66" />
            <rect x="14" y="44" width="90" height="6" rx="2" fill="#1b3550" />
            <path d="M200 24l6 6-6 6" fill="none" stroke="#4a6a88" stroke-width="1.5" />
        </g>
    </defs>

    <rect width="1600" height="700" fill="#07111c" />
    <rect width="1600" height="700" fill="url(#dots)" />
    <ellipse cx="760" cy="350" rx="760" ry="380" fill="url(#glow)" />

    <!-- desktop window -->
    <g filter="url(#shadow)">
        <rect x="70" y="60" width="1080" height="590" rx="10" fill="#0a1724" stroke="#16324a" />
    </g>
    <rect x="70" y="60" width="1080" height="32" rx="10" fill="#0d2133" />
    <rect x="70" y="82" width="1080" height="10" fill="#0d2133" />
    <circle cx="92" cy="76" r="5" fill="#2a4a66" /><circle cx="110" cy="76" r="5" fill="#2a4a66" /><circle cx="128" cy="76" r="5" fill="#2a4a66" />
    <rect x="460" y="68" width="300" height="16" rx="8" fill="#07111c" stroke="#16324a" />

    <!-- sidebar -->
    <rect x="70" y="92" width="190" height="558" fill="#0b1a28" />
    <rect x="259" y="92" width="1" height="558" fill="#14304a" />
    <rect x="90" y="112" width="24" height="24" rx="4" fill="none" stroke="#00eeff" stroke-width="2" />
    <rect x="124" y="120" width="90" height="8" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <g fill="#1b3550">
        <rect x="92" y="168" width="96" height="7" rx="2" />
        <rect x="92" y="232" width="70" height="7" rx="2" />
        <rect x="92" y="260" width="104" height="7" rx="2" />
        <rect x="92" y="288" width="84" height="7" rx="2" />
        <rect x="92" y="316" width="92" height="7" rx="2" />
        <rect x="92" y="344" width="66" height="7" rx="2" />
    </g>
    <rect x="82" y="190" width="166" height="26" rx="4" fill="#00eeff" fill-opacity=".12" />
    <rect x="82" y="190" width="3" height="26" fill="#00eeff" />
    <text x="96" y="206" fill="#00eeff">BROADBANDS</text>
    <text x="92" y="400" fill="#4a6a88">SETTINGS</text>
    <g fill="#1b3550">
        <rect x="92" y="416" width="80" height="7" rx="2" />
        <rect x="92" y="444" width="96" height="7" rx="2" />
        <rect x="92" y="472" width="72" height="7" rx="2" />
    </g>

    <!-- persistent workspace header -->
    <rect x="290" y="114" width="830" height="104" rx="6" fill="#0b1a28" stroke="#16324a" />
    <text x="310" y="138" fill="#4a6a88">MODEM ID</text>
    <rect x="310" y="148" width="190" height="16" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <use href="#ok" x="516" y="148" />
    <g fill="#4a6a88">
        <text x="310" y="196">PACKAGE</text>
        <text x="500" y="196">RGW SERIAL</text>
        <text x="690" y="196">ONT SERIAL</text>
        <text x="880" y="196">VOIP</text>
    </g>
    <g fill="#2a4a66">
        <rect x="372" y="189" width="100" height="7" rx="2" />
        <rect x="584" y="189" width="90" height="7" rx="2" />
        <rect x="774" y="189" width="90" height="7" rx="2" />
        <rect x="922" y="189" width="80" height="7" rx="2" />
    </g>
    <rect x="1010" y="140" width="90" height="26" rx="4" fill="none" stroke="#2a4a66" />
    <rect x="1030" y="150" width="50" height="6" rx="2" fill="#2a4a66" />

    <!-- section nav -->
    <g>
        <rect x="290" y="232" width="830" height="34" fill="#07111c" />
        <rect x="290" y="265" width="830" height="1" fill="#14304a" />
        <text x="306" y="253" fill="#00eeff">OVERVIEW</text>
        <rect x="300" y="263" width="72" height="3" fill="#00eeff" />
        <text x="410" y="253" fill="#4a6a88">CONNECTED DEVICES</text>
        <text x="580" y="253" fill="#4a6a88">PROVISIONING</text>
        <text x="720" y="253" fill="#4a6a88">ONT</text>
        <text x="780" y="253" fill="#4a6a88">DIAGNOSTICS</text>
        <text x="910" y="253" fill="#4a6a88">HISTORY</text>
    </g>

    <!-- account card -->
    <rect x="290" y="286" width="830" height="148" rx="6" fill="#0b1a28" stroke="#16324a" />
    <rect x="310" y="304" width="90" height="10" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <use href="#kv" x="310" y="334" />
    <use href="#kv" x="310" y="356" />
    <use href="#kv" x="310" y="378" />
    <use href="#kv" x="310" y="400" />
    <use href="#kv" x="700" y="334" />
    <use href="#kv" x="700" y="356" />
    <use href="#kv" x="700" y="378" />

    <!-- VoIP lines card -->
    <rect x="290" y="450" width="830" height="180" rx="6" fill="#0b1a28" stroke="#16324a" />
    <rect x="310" y="468" width="80" height="10" rx="2" fill="#c8d8f0" fill-opacity=".85" />
    <g transform="translate(310 492)">
        <rect width="790" height="26" fill="#0d2133" />
        <g fill="#4a6a88">
            <text x="16" y="17">DN</text>
            <text x="170" y="17">DOMAIN</text>
            <text x="340" y="17">SERIAL</text>
            <text x="640" y="17">STATUS</text>
        </g>
    </g>
    <use href="#vrow" x="310" y="518" />
    <use href="#vrow" x="310" y="548" />
    <use href="#vrow" x="310" y="578" />
    <use href="#ok" x="950" y="525" />
    <use href="#ok" x="950" y="555" />
    <use href="#ok" x="950" y="585" />

    <!-- phone: installer search-only -->
    <g filter="url(#shadow)">
        <rect x="1226" y="120" width="276" height="524" rx="32" fill="#0d2133" stroke="#2a4a66" stroke-width="2" />
    </g>
    <g clip-path="url(#phone-screen)">
        <rect x="1238" y="132" width="252" height="500" fill="#07111c" />
        <rect x="1324" y="140" width="80" height="16" rx="8" fill="#0d2133" />
        <rect x="1238" y="166" width="252" height="44" fill="#0b1a28" />
        <rect x="1254" y="178" width="20" height="20" rx="4" fill="none" stroke="#00eeff" stroke-width="2" />
        <rect x="1284" y="184" width="80" height="8" rx="2" fill="#c8d8f0" fill-opacity=".85" />
        <text x="1254" y="236" fill="#4a6a88">INSTALLER SEARCH</text>
        <rect x="1254" y="246" width="220" height="34" rx="4" fill="#0a1724" stroke="#00eeff" stroke-opacity=".8" />
        <rect x="1268" y="259" width="64" height="8" rx="2" fill="#c8d8f0" fill-opacity=".7" />
        <rect x="1336" y="256" width="2" height="14" fill="#00eeff" />
        <rect x="1254" y="290" width="110" height="18" rx="9" fill="#7c8cff" fill-opacity=".12" stroke="#7c8cff" stroke-opacity=".6" />
        <text x="1266" y="302" fill="#7c8cff" font-size="8">MIN 4 CHARS</text>
        <use href="#hit" x="1254" y="324" />
        <use href="#hit" x="1254" y="392" />
        <rect x="1254" y="470" width="220" height="1" fill="#14304a" />
        <rect x="1294" y="490" width="140" height="7" rx="2" fill="#1b3550" />
        <rect x="1314" y="504" width="100" height="7" rx="2" fill="#1b3550" />
    </g>
    <rect x="1324" y="616" width="80" height="4" rx="2" fill="#2a4a66" />
</svg>
