<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" letter-spacing="1">
    <!-- Process: deleting a fibre ONT service removes the portal's record only once the network controller confirms the service is gone; "unknown" keeps it. Wireframe only: no real data. -->
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0l10 5-10 5z" fill="#00eeff" />
        </marker>
        <marker id="arr-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0l10 5-10 5z" fill="#ff0066" />
        </marker>
        <marker id="arr-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 0l10 5-10 5z" fill="#ffb020" />
        </marker>
    </defs>

    <rect width="400" height="300" fill="#07111c" />

    <text x="20" y="26" fill="#4a6a88" font-size="9" letter-spacing="2">ONT DELETE, FAIL SAFE</text>

    <!-- delete -->
    <rect x="20" y="40" width="130" height="30" rx="4" fill="#0d2133" stroke="#16324a" />
    <text x="85" y="58" fill="#c8d8f0" text-anchor="middle">DELETE IN NCE</text>
    <path d="M150 55h56" stroke="#00eeff" marker-end="url(#arr)" />
    <text x="160" y="49" fill="#00eeff">204</text>

    <!-- remove record -->
    <rect x="210" y="40" width="170" height="30" rx="4" fill="#0d2133" stroke="#00eeff" stroke-opacity=".7" />
    <text x="295" y="58" fill="#00eeff" text-anchor="middle">REMOVE ONT RECORD</text>

    <!-- not confirmed -->
    <path d="M85 70v28" stroke="#4a6a88" stroke-dasharray="4 3" />
    <text x="92" y="88" fill="#4a6a88">not confirmed</text>

    <!-- existence check -->
    <path d="M85 98l50 30-50 30-50-30z" fill="#0a1724" stroke="#00eeff" stroke-opacity=".7" />
    <text x="85" y="126" fill="#c8d8f0" text-anchor="middle">STILL</text>
    <text x="85" y="137" fill="#c8d8f0" text-anchor="middle">THERE?</text>

    <!-- no -> remove -->
    <path d="M135 128h160V74" fill="none" stroke="#00eeff" marker-end="url(#arr)" />
    <text x="150" y="122" fill="#00eeff">NO (EMPTY / 404)</text>

    <!-- yes -> keep -->
    <path d="M85 158v36" stroke="#ff0066" marker-end="url(#arr-hot)" />
    <text x="92" y="180" fill="#ff0066">YES</text>
    <rect x="20" y="198" width="160" height="40" rx="4" fill="#0a1724" stroke="#ff0066" stroke-opacity=".7" />
    <text x="32" y="215" fill="#ff0066">KEEP RECORD</text>
    <text x="32" y="229" fill="#4a6a88">report the failure</text>

    <!-- unknown -> keep, retry -->
    <path d="M120 149l82 49" stroke="#ffb020" marker-end="url(#arr-amb)" />
    <text x="164" y="164" fill="#ffb020" transform="rotate(31 164 164)">UNKNOWN</text>
    <rect x="210" y="198" width="170" height="40" rx="4" fill="#0a1724" stroke="#ffb020" stroke-opacity=".7" />
    <text x="222" y="215" fill="#ffb020">KEEP RECORD</text>
    <text x="222" y="229" fill="#4a6a88">NCE error: try again</text>

    <rect x="20" y="256" width="360" height="1" fill="#14304a" />
    <text x="20" y="276" fill="#4a6a88">portal and controller never disagree silently</text>
</svg>
