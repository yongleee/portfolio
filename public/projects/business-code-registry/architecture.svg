<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5">
    <!-- High-level system diagram. Generic components only. -->
    <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0v20" fill="none" stroke="#0d2133" />
        </pattern>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#00eeff" />
        </marker>
        <marker id="arrow-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#4a6a88" />
        </marker>
    </defs>

    <rect width="800" height="400" fill="#07111c" />
    <rect width="800" height="400" fill="url(#grid)" />

    <!-- links -->
    <g fill="none" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M220 105h40v70h46" />
        <path d="M220 285h40v-60h46" />
        <path d="M490 175h40v-100h66" />
        <path d="M490 225h40v100h66" />
    </g>
    <g fill="none" stroke="#4a6a88" stroke-width="1.5" stroke-dasharray="4 4">
        <path d="M400 150v-40" marker-end="url(#arrow-dim)" />
        <path d="M400 250v50" marker-end="url(#arrow-dim)" />
        <path d="M490 200h106" marker-end="url(#arrow-dim)" />
        <path d="M220 310h30v60h330v-155h16" marker-end="url(#arrow-dim)" />
    </g>
    <g fill="#4a6a88" font-size="9">
        <text x="232" y="166">JWT</text>
        <text x="232" y="248">REST</text>
        <text x="540" y="194">REINDEX</text>
        <text x="410" y="134">SSO</text>
        <text x="410" y="282">LOGS</text>
        <text x="262" y="364">AI CHAT</text>
    </g>

    <!-- clients -->
    <rect x="40" y="70" width="180" height="70" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
    <rect x="40" y="70" width="180" height="18" fill="#00eeff" />
    <text x="50" y="83" font-size="9" fill="#07111c" font-weight="bold">CLIENT // ADMIN</text>
    <text x="50" y="112" fill="#c8d8f0">ADMIN CONSOLE</text>
    <text x="50" y="128" font-size="9" fill="#4a6a88">NEXT.JS · RBAC</text>

    <rect x="40" y="250" width="180" height="70" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
    <rect x="40" y="250" width="180" height="18" fill="#00eeff" />
    <text x="50" y="263" font-size="9" fill="#07111c" font-weight="bold">CLIENT // PUBLIC</text>
    <text x="50" y="292" fill="#c8d8f0">SEARCH PORTAL</text>
    <text x="50" y="308" font-size="9" fill="#4a6a88">NEXT.JS · EN / BM</text>

    <!-- core -->
    <rect x="310" y="150" width="180" height="100" fill="#0d2133" stroke="#00eeff" stroke-width="2" />
    <rect x="310" y="150" width="180" height="18" fill="#00eeff" />
    <text x="320" y="163" font-size="9" fill="#07111c" font-weight="bold">CORE // API</text>
    <text x="320" y="194" fill="#c8d8f0">LARAVEL API</text>
    <text x="320" y="212" font-size="9" fill="#4a6a88">IMPORT · PUBLISH</text>
    <text x="320" y="226" font-size="9" fill="#4a6a88">AUDIT · QUEUE</text>
    <circle cx="474" cy="236" r="4" fill="#ff0066" />

    <!-- edges -->
    <rect x="310" y="60" width="180" height="50" fill="#0b1a28" stroke="#2a4a66" />
    <text x="320" y="82" fill="#c8d8f0">IDENTITY</text>
    <text x="320" y="98" font-size="9" fill="#4a6a88">ENTRA ID · ROLES</text>

    <rect x="310" y="300" width="180" height="50" fill="#0b1a28" stroke="#2a4a66" />
    <text x="320" y="322" fill="#c8d8f0">OBSERVABILITY</text>
    <text x="320" y="338" font-size="9" fill="#4a6a88">FLUENT BIT → BLOB</text>

    <!-- data -->
    <g fill="#0b1a28" stroke="#2a4a66">
        <rect x="600" y="45" width="160" height="60" />
        <rect x="600" y="170" width="160" height="60" />
        <rect x="600" y="295" width="160" height="60" />
    </g>
    <ellipse cx="620" cy="66" rx="10" ry="4" fill="none" stroke="#00eeff" />
    <path d="M610 66v16c0 2 4 4 10 4s10-2 10-4V66" fill="none" stroke="#00eeff" />
    <text x="640" y="72" fill="#c8d8f0">SQL SERVER</text>
    <text x="640" y="88" font-size="9" fill="#4a6a88">DRAFT · LIVE</text>
    <text x="614" y="196" fill="#c8d8f0">AI SEARCH</text>
    <text x="614" y="212" font-size="9" fill="#4a6a88">VECTOR INDEX</text>
    <text x="614" y="321" fill="#c8d8f0">REDIS</text>
    <text x="614" y="337" font-size="9" fill="#4a6a88">QUEUE · CACHE</text>

    <text x="40" y="392" font-size="9" fill="#2a4a66">SYS.MAP // AZURE APP SERVICE · DEV / STAGING / PROD</text>
</svg>
