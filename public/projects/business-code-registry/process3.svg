<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1" text-anchor="middle">
    <!-- Sketch: branch-driven CI/CD into three environments. -->
    <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#00eeff" />
        </marker>
        <marker id="arrow-dim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0l8 4-8 4z" fill="#4a6a88" />
        </marker>
        <g id="stage">
            <path d="M94 17h18" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)" />
            <rect x="116" width="72" height="34" fill="#0b1a28" stroke="#2a4a66" />
            <text x="152" y="21" fill="#c8d8f0">BUILD</text>
            <path d="M188 17h18" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)" />
            <rect x="210" width="72" height="34" fill="#0b1a28" stroke="#2a4a66" />
            <text x="246" y="21" fill="#c8d8f0">PUSH ACR</text>
            <path d="M282 17h18" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arrow)" />
            <rect x="304" width="72" height="34" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".6" />
            <text x="340" y="21" fill="#00eeff">DEPLOY</text>
        </g>
    </defs>

    <rect width="400" height="400" fill="#07111c" />
    <text x="24" y="36" font-size="10" letter-spacing="2" fill="#00eeff" text-anchor="start">03 // CI/CD</text>
    <rect x="24" y="44" width="352" height="1" fill="#16324a" />

    <!-- branches -->
    <g fill="#0b1a28">
        <rect x="24" y="84" width="70" height="34" rx="17" stroke="#7c8cff" />
        <rect x="24" y="184" width="70" height="34" rx="17" stroke="#ffb020" />
        <rect x="24" y="284" width="70" height="34" rx="17" stroke="#00eeff" />
    </g>
    <text x="59" y="105" fill="#7c8cff">DEV</text>
    <text x="59" y="205" fill="#ffb020">STAGING</text>
    <text x="59" y="305" fill="#00eeff">PROD</text>

    <use href="#stage" y="84" />
    <use href="#stage" y="184" />
    <use href="#stage" y="284" />

    <!-- promotion -->
    <g fill="none" stroke="#4a6a88" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-dim)">
        <path d="M59 122v56" />
        <path d="M59 222v56" />
    </g>
    <g fill="#4a6a88" text-anchor="start">
        <text x="66" y="154">MERGE</text>
        <text x="66" y="254">MERGE</text>
    </g>

    <text x="200" y="370" fill="#2a4a66">ONE PIPELINE · STAGES CHOSEN BY BRANCH · SECRETS PER ENV</text>
</svg>
