    <rect x="610" y="40" width="160" height="320" fill="#0b1a28" stroke="#16324a" />
    <rect x="610" y="40" width="160" height="26" fill="#0d2133" />
    <circle cx="626" cy="53" r="6" fill="#ff0066" fill-opacity=".25" stroke="#ff0066" />
    <text x="638" y="57" fill="#c8d8f0">ASSISTANT</text>
    <rect x="620" y="80" width="120" height="40" rx="8" fill="#0d2133" />
    <rect x="630" y="92" width="96" height="6" rx="2" fill="#4a6a88" />
    <rect x="630" y="104" width="70" height="6" rx="2" fill="#4a6a88" />
    <rect x="660" y="132" width="100" height="26" rx="8" fill="#00eeff" fill-opacity=".18" />
    <rect x="670" y="142" width="74" height="6" rx="2" fill="#00eeff" />
    <rect x="620" y="170" width="130" height="64" rx="8" fill="#0d2133" />
    <rect x="630" y="182" width="104" height="6" rx="2" fill="#4a6a88" />
    <rect x="630" y="194" width="88" height="6" rx="2" fill="#4a6a88" />
    <rect x="630" y="210" width="40" height="14" rx="7" fill="none" stroke="#00eeff" />
    <rect x="676" y="210" width="40" height="14" rx="7" fill="none" stroke="#00eeff" />
    <rect x="620" y="324" width="140" height="26" rx="13" fill="#07111c" stroke="#2a4a66" />
    <rect x="632" y="334" width="70" height="6" rx="2" fill="#1b3550" />
    <circle cx="748" cy="337" r="8" fill="#00eeff" />
</svg>
