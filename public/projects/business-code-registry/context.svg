        <path d="M160 157h5v-36h5" />
        <path d="M300 121h5v72h5" />
        <path d="M440 193h5v-72h5" />
    </g>

    <!-- leaf detail -->
    <rect x="450" y="190" width="130" height="160" fill="#0b1a28" stroke="#00eeff" stroke-opacity=".5" />
    <rect x="450" y="190" width="130" height="16" fill="#00eeff" />
    <text x="458" y="201" fill="#07111c" font-weight="bold">DETAIL</text>
    <rect x="460" y="218" width="54" height="12" rx="2" fill="#00eeff" />
    <g fill="#2a4a66">
        <rect x="460" y="240" width="108" height="6" rx="2" />
        <rect x="460" y="252" width="96" height="6" rx="2" />
        <rect x="460" y="264" width="102" height="6" rx="2" />
        <rect x="460" y="282" width="80" height="6" rx="2" />
        <rect x="460" y="294" width="90" height="6" rx="2" />
