<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Search by structure: hierarchy drill-down beside the assistant. Wireframe only. -->
    <defs>
        <g id="item">
            <rect width="130" height="30" fill="#0b1a28" stroke="#16324a" />
            <rect x="10" y="11" width="28" height="8" rx="2" fill="#2a4a66" />
            <path d="M116 11l4 4-4 4" fill="none" stroke="#2a4a66" stroke-width="1.5" />
        </g>
        <g id="pick">
            <rect width="130" height="30" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" />
            <rect x="10" y="11" width="28" height="8" rx="2" fill="#00eeff" />
            <path d="M116 11l4 4-4 4" fill="none" stroke="#00eeff" stroke-width="1.5" />
        </g>
    </defs>

    <rect width="800" height="400" fill="#07111c" />

    <!-- level headers -->
    <g fill="#4a6a88">
        <text x="30" y="52">LEVEL 1</text>
        <text x="170" y="52">LEVEL 2</text>
        <text x="310" y="52">LEVEL 3</text>
        <text x="450" y="52">LEVEL 4</text>
    </g>
    <g fill="#16324a">
        <rect x="30" y="58" width="130" height="1" />
        <rect x="170" y="58" width="130" height="1" />
        <rect x="310" y="58" width="130" height="1" />
        <rect x="450" y="58" width="130" height="1" />
    </g>

    <!-- level 1 -->
    <use href="#item" x="30" y="70" />
    <use href="#item" x="30" y="106" />
    <use href="#pick" x="30" y="142" />
    <use href="#item" x="30" y="178" />
    <use href="#item" x="30" y="214" />
    <use href="#item" x="30" y="250" />
    <use href="#item" x="30" y="286" />
    <use href="#item" x="30" y="322" />
    <!-- level 2 -->
    <use href="#item" x="170" y="70" />
    <use href="#pick" x="170" y="106" />
    <use href="#item" x="170" y="142" />
    <use href="#item" x="170" y="178" />
    <use href="#item" x="170" y="214" />
    <use href="#item" x="170" y="250" />
    <!-- level 3 -->
    <use href="#item" x="310" y="70" />
    <use href="#item" x="310" y="106" />
    <use href="#item" x="310" y="142" />
    <use href="#pick" x="310" y="178" />
    <use href="#item" x="310" y="214" />
    <!-- level 4 -->
    <use href="#item" x="450" y="70" />
    <use href="#pick" x="450" y="106" />
    <use href="#item" x="450" y="142" />

    <!-- labels -->
    <g fill="#1b3550">
        <rect x="76" y="82" width="60" height="6" rx="2" />
        <rect x="76" y="118" width="48" height="6" rx="2" />
        <rect x="76" y="190" width="56" height="6" rx="2" />
        <rect x="76" y="226" width="40" height="6" rx="2" />
        <rect x="76" y="262" width="62" height="6" rx="2" />
        <rect x="76" y="298" width="50" height="6" rx="2" />
        <rect x="76" y="334" width="44" height="6" rx="2" />
        <rect x="216" y="82" width="52" height="6" rx="2" />
        <rect x="216" y="154" width="60" height="6" rx="2" />
        <rect x="216" y="190" width="42" height="6" rx="2" />
        <rect x="216" y="226" width="56" height="6" rx="2" />
        <rect x="216" y="262" width="46" height="6" rx="2" />
        <rect x="356" y="82" width="58" height="6" rx="2" />
        <rect x="356" y="118" width="44" height="6" rx="2" />
        <rect x="356" y="154" width="52" height="6" rx="2" />
        <rect x="356" y="226" width="40" height="6" rx="2" />
        <rect x="496" y="82" width="54" height="6" rx="2" />
        <rect x="496" y="154" width="46" height="6" rx="2" />
    </g>
    <g fill="#c8d8f0" fill-opacity=".8">
