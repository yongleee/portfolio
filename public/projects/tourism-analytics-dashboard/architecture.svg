<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Architecture: browser -> Next.js app (role gate, auth callback, BFF proxy) -> Express API -> Redis, CMS and the Fabric warehouse, with Entra ID above and the Azure DevOps delivery chain below. No hostnames or real names. -->
    <defs>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#14304a" />
        </pattern>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0L10 5 0 10z" fill="#00eeff" />
        </marker>
        <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0L10 5 0 10z" fill="#4a6a88" />
        </marker>
    </defs>

    <rect width="800" height="500" fill="#07111c" />
    <rect width="800" height="500" fill="url(#dots)" />

    <!-- identity -->
    <rect x="398" y="14" width="170" height="36" rx="3" fill="#0b1a28" stroke="#ff0066" stroke-opacity=".7" />
    <text x="483" y="36" fill="#ff0066" text-anchor="middle">ENTRA ID · GRAPH</text>

    <!-- browser + client-side services -->
    <rect x="20" y="175" width="110" height="90" rx="4" fill="#0b1a28" stroke="#2a4a66" />
    <rect x="20" y="175" width="110" height="16" rx="4" fill="#0d2133" />
    <circle cx="30" cy="183" r="2.5" fill="#4a6a88" />
    <circle cx="39" cy="183" r="2.5" fill="#4a6a88" />
    <text x="75" y="222" fill="#c8d8f0" text-anchor="middle">BROWSER</text>
    <rect x="40" y="236" width="70" height="6" rx="2" fill="#1b3550" />
    <g fill="#0a1724" stroke="#16324a">
        <rect x="20" y="290" width="110" height="32" rx="3" />
        <rect x="20" y="334" width="110" height="32" rx="3" />
    </g>
    <g fill="#4a6a88" font-size="8" letter-spacing="1" text-anchor="middle">
        <text x="75" y="309">AZURE MAPS</text>
        <text x="75" y="353">POWER BI EMBED</text>
    </g>
    <path d="M75 265v23" stroke="#4a6a88" stroke-dasharray="3 3" marker-end="url(#arr2)" />
    <path d="M14 230v120h4" fill="none" stroke="#4a6a88" stroke-dasharray="3 3" marker-end="url(#arr2)" />
    <path d="M20 230h-6" stroke="#4a6a88" stroke-dasharray="3 3" />

    <!-- Next.js -->
    <rect x="168" y="70" width="170" height="260" rx="4" fill="#0b1a28" stroke="#16324a" />
    <path d="M172 70h162a4 4 0 0 1 4 4v14H168V74a4 4 0 0 1 4-4z" fill="#00eeff" />
    <text x="178" y="83" fill="#07111c" font-weight="bold">WEB // NEXT.JS</text>
    <g fill="#0a1724" stroke="#14304a">
        <rect x="180" y="100" width="146" height="28" rx="2" />
        <rect x="180" y="158" width="146" height="28" rx="2" />
        <rect x="180" y="206" width="146" height="28" rx="2" stroke="#00eeff" />
        <rect x="180" y="246" width="146" height="28" rx="2" />
        <rect x="180" y="284" width="146" height="28" rx="2" />
    </g>
    <g fill="#c8d8f0" font-size="8" letter-spacing="1">
        <text x="190" y="117">MIDDLEWARE · ROLES</text>
        <text x="190" y="175">AUTH CALLBACK</text>
        <text x="190" y="223" fill="#00eeff">BFF PROXY</text>
        <text x="190" y="263">EXPORT ROUTES</text>
        <text x="190" y="301">POWER BI TOKEN</text>
    </g>

    <!-- Express -->
    <rect x="398" y="70" width="170" height="260" rx="4" fill="#0b1a28" stroke="#16324a" />
    <path d="M402 70h162a4 4 0 0 1 4 4v14H398V74a4 4 0 0 1 4-4z" fill="#00eeff" />
    <text x="408" y="83" fill="#07111c" font-weight="bold">CORE // EXPRESS 5</text>
    <g fill="#0a1724" stroke="#14304a">
        <rect x="410" y="100" width="146" height="28" rx="2" stroke="#ff0066" stroke-opacity=".7" />
        <rect x="410" y="158" width="146" height="28" rx="2" stroke="#ff0066" stroke-opacity=".7" />
        <rect x="410" y="206" width="146" height="28" rx="2" />
        <rect x="410" y="246" width="146" height="28" rx="2" />
        <rect x="410" y="284" width="146" height="28" rx="2" />
    </g>
    <g fill="#c8d8f0" font-size="8" letter-spacing="1">
        <text x="420" y="117">TOKEN CHECK</text>
        <text x="420" y="175">ROLE CHECK · JWKS</text>
        <text x="420" y="223">21 ROUTES</text>
        <text x="420" y="263">QUERY SERVICES</text>
        <text x="420" y="301">ODBC POOL</text>
    </g>

    <!-- data side -->
    <rect x="616" y="92" width="164" height="44" rx="3" fill="#0b1a28" stroke="#2a4a66" />
    <text x="628" y="110" fill="#c8d8f0">REDIS</text>
    <text x="628" y="126" fill="#4a6a88" font-size="8" letter-spacing="1">HASHED KEYS · 5 MIN</text>
    <rect x="616" y="200" width="164" height="40" rx="3" fill="#0b1a28" stroke="#2a4a66" />
    <text x="628" y="224" fill="#c8d8f0">WORDPRESS CMS</text>
    <rect x="616" y="266" width="164" height="64" rx="3" fill="#0b1a28" stroke="#00eeff" />
    <text x="628" y="290" fill="#00eeff">MICROSOFT FABRIC</text>
    <text x="628" y="306" fill="#4a6a88" font-size="8" letter-spacing="1">VISITOR WAREHOUSE</text>
    <g fill="#1b3550">
        <rect x="628" y="314" width="40" height="6" rx="2" />
        <rect x="674" y="314" width="56" height="6" rx="2" />
    </g>

    <!-- flows -->
    <path d="M130 220h36" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arr)" />
    <path d="M326 220h70" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arr)" />
    <text x="362" y="212" fill="#4a6a88" font-size="8" letter-spacing="1" text-anchor="middle">TOKENS</text>
    <path d="M556 114h58" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arr)" />
    <path d="M556 220h58" stroke="#4a6a88" stroke-dasharray="3 3" marker-end="url(#arr2)" />
    <path d="M556 298h58" stroke="#00eeff" stroke-width="1.5" marker-end="url(#arr)" />
    <!-- OIDC sign-in and token verification -->
    <path d="M253 70V32h143" fill="none" stroke="#ff0066" stroke-opacity=".7" stroke-dasharray="3 3" marker-end="url(#arr2)" />
    <text x="262" y="26" fill="#4a6a88" font-size="8" letter-spacing="1">OIDC CODE</text>
    <path d="M483 68V52" stroke="#ff0066" stroke-opacity=".7" stroke-dasharray="3 3" marker-end="url(#arr2)" />
    <text x="492" y="64" fill="#4a6a88" font-size="8" letter-spacing="1">/ME · JWKS</text>

    <!-- delivery -->
    <rect x="20" y="392" width="760" height="92" rx="4" fill="#0a1724" stroke="#14304a" />
    <text x="34" y="410" fill="#4a6a88">DELIVERY // AZURE DEVOPS</text>
    <g fill="#0b1a28" stroke="#2a4a66">
        <rect x="34" y="424" width="130" height="40" rx="3" />
        <rect x="204" y="424" width="130" height="40" rx="3" />
        <rect x="374" y="424" width="130" height="40" rx="3" />
    </g>
    <g fill="#c8d8f0" text-anchor="middle">
        <text x="99" y="447">PIPELINE</text>
        <text x="269" y="447">DOCKER BUILD</text>
        <text x="439" y="447">ACR</text>
    </g>
    <rect x="544" y="424" width="222" height="40" rx="3" fill="#0b1a28" stroke="#00eeff" />
    <text x="556" y="440" fill="#00eeff" font-size="8" letter-spacing="1">APP SERVICE</text>
    <g font-size="8" letter-spacing="1" text-anchor="middle">
        <rect x="556" y="446" width="56" height="12" rx="6" fill="#00eeff" fill-opacity=".12" stroke="#00eeff" stroke-opacity=".6" />
        <rect x="620" y="446" width="64" height="12" rx="6" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-opacity=".6" />
        <rect x="692" y="446" width="64" height="12" rx="6" fill="#ff0066" fill-opacity=".12" stroke="#ff0066" stroke-opacity=".6" />
        <text x="584" y="455" fill="#00eeff">DEV</text>
        <text x="652" y="455" fill="#ffb020">STAGING</text>
        <text x="724" y="455" fill="#ff0066">PROD</text>
    </g>
    <g stroke="#00eeff" stroke-width="1.5" marker-end="url(#arr)">
        <path d="M164 444h38" />
        <path d="M334 444h38" />
        <path d="M504 444h38" />
    </g>
</svg>
