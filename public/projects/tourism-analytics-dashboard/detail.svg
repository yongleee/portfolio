<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.5">
    <!-- Signature feature: the period filter. A quarter picker defaults to the latest loaded range, every KPI card is compared with the equal-length period before it, and the trend chart marks both ranges. Wireframe only: no real data. -->
    <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#14304a" />
        </pattern>
        <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
            <feDropShadow dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55" />
        </filter>
        <g id="card">
            <rect width="204" height="82" fill="#0a1724" stroke="#14304a" />
            <rect x="14" y="14" width="80" height="6" rx="2" fill="#1b3550" />
            <rect x="14" y="30" width="88" height="16" rx="2" fill="#c8d8f0" fill-opacity=".85" />
            <text x="14" y="68" fill="#7c8cff" font-size="8" letter-spacing="1">PREV</text>
            <rect x="46" y="62" width="54" height="6" rx="2" fill="#7c8cff" fill-opacity=".5" />
        </g>
        <g id="up">
            <path d="M0 7l6-7 6 7z" fill="#00eeff" />
            <rect x="16" y="0" width="40" height="7" rx="2" fill="#00eeff" fill-opacity=".85" />
        </g>
        <g id="down">
            <path d="M0 0l6 7 6-7z" fill="#ff0066" />
            <rect x="16" y="0" width="34" height="7" rx="2" fill="#ff0066" fill-opacity=".85" />
        </g>
    </defs>

    <rect width="800" height="500" fill="#07111c" />
    <rect width="800" height="500" fill="url(#dots)" />

    <!-- sheet -->
    <rect x="40" y="30" width="720" height="440" rx="6" fill="#0b1a28" stroke="#16324a" filter="url(#lift)" />
    <path d="M46 30h708a6 6 0 0 1 6 6v16H40V36a6 6 0 0 1 6-6z" fill="#00eeff" />
    <text x="56" y="45" fill="#07111c" font-weight="bold">OVERVIEW // PERIOD VS PREVIOUS</text>
    <text x="744" y="45" fill="#07111c" font-weight="bold" text-anchor="end">QUARTERLY</text>

    <!-- granularity + range -->
    <rect x="56" y="66" width="264" height="26" rx="13" fill="#07111c" stroke="#2a4a66" />
    <rect x="190" y="68" width="74" height="22" rx="11" fill="#00eeff" fill-opacity=".15" stroke="#00eeff" />
    <g text-anchor="middle" fill="#4a6a88">
        <text x="88" y="82">DAY</text>
        <text x="148" y="82">MONTH</text>
        <text x="227" y="82" fill="#00eeff">QUARTER</text>
        <text x="292" y="82">YEAR</text>
    </g>
    <rect x="334" y="66" width="170" height="26" rx="3" fill="#07111c" stroke="#00eeff" />
    <rect x="346" y="75" width="10" height="8" rx="1" fill="none" stroke="#00eeff" />
    <rect x="366" y="76" width="104" height="6" rx="2" fill="#c8d8f0" fill-opacity=".8" />
    <rect x="606" y="68" width="138" height="22" rx="11" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-opacity=".6" />
    <circle cx="622" cy="79" r="3" fill="#ffb020" />
    <text x="632" y="83" fill="#ffb020" font-size="8" letter-spacing="1">LATEST LOADED</text>

    <!-- quarter picker -->
    <rect x="56" y="108" width="244" height="182" rx="4" fill="#0d2133" stroke="#16324a" />
    <g fill="#2a4a66">
        <rect x="72" y="140" width="32" height="6" rx="2" />
        <rect x="72" y="186" width="32" height="6" rx="2" />
    </g>
    <g text-anchor="middle" fill="#4a6a88" font-size="8" letter-spacing="1">
        <text x="134" y="126">Q1</text>
        <text x="176" y="126">Q2</text>
        <text x="218" y="126">Q3</text>
        <text x="260" y="126">Q4</text>
    </g>
    <!-- year one: Q3-Q4 compared -->
    <g fill="#0a1724" stroke="#14304a">
        <rect x="116" y="130" width="36" height="28" rx="2" />
        <rect x="158" y="130" width="36" height="28" rx="2" />
    </g>
    <g fill="#7c8cff" fill-opacity=".14" stroke="#7c8cff" stroke-dasharray="3 2">
        <rect x="200" y="130" width="36" height="28" rx="2" />
        <rect x="242" y="130" width="36" height="28" rx="2" />
    </g>
    <!-- year two: Q1-Q2 selected, Q3-Q4 not loaded -->
    <g fill="#00eeff" fill-opacity=".22" stroke="#00eeff">
        <rect x="116" y="176" width="36" height="28" rx="2" />
        <rect x="158" y="176" width="36" height="28" rx="2" />
    </g>
    <g fill="none" stroke="#2a4a66" stroke-dasharray="2 3">
        <rect x="200" y="176" width="36" height="28" rx="2" />
        <rect x="242" y="176" width="36" height="28" rx="2" />
    </g>
    <path d="M72 222h212" stroke="#16324a" />
    <rect x="72" y="236" width="12" height="10" rx="2" fill="#00eeff" fill-opacity=".22" stroke="#00eeff" />
    <text x="92" y="245" fill="#c8d8f0" font-size="8" letter-spacing="1">SELECTED</text>
    <rect x="170" y="236" width="12" height="10" rx="2" fill="#7c8cff" fill-opacity=".14" stroke="#7c8cff" stroke-dasharray="3 2" />
    <text x="190" y="245" fill="#c8d8f0" font-size="8" letter-spacing="1">COMPARED</text>
    <rect x="72" y="260" width="12" height="10" rx="2" fill="none" stroke="#2a4a66" stroke-dasharray="2 3" />
    <text x="92" y="269" fill="#4a6a88" font-size="8" letter-spacing="1">NOT LOADED YET</text>

    <!-- KPI cards -->
    <use href="#card" x="316" y="108" />
    <use href="#card" x="540" y="108" />
    <use href="#card" x="316" y="208" />
    <use href="#card" x="540" y="208" />
    <use href="#up" x="436" y="140" />
    <use href="#up" x="660" y="140" />
    <use href="#down" x="436" y="240" />
    <use href="#up" x="660" y="240" />

    <!-- trend with both ranges marked -->
    <rect x="56" y="306" width="688" height="148" fill="#0a1724" stroke="#14304a" />
    <text x="68" y="324" fill="#4a6a88">VISITORS BY QUARTER</text>
    <rect x="462" y="332" width="116" height="102" fill="#7c8cff" fill-opacity=".08" />
    <rect x="590" y="332" width="116" height="102" fill="#00eeff" fill-opacity=".08" />
    <path d="M462 332v102M578 332v102" stroke="#7c8cff" stroke-opacity=".6" stroke-dasharray="3 3" />
    <path d="M590 332v102M706 332v102" stroke="#00eeff" stroke-opacity=".6" stroke-dasharray="3 3" />
    <path d="M76 434h648" stroke="#2a4a66" />
    <g fill="#2a4a66" fill-opacity=".6">
        <rect x="84" y="398" width="34" height="36" />
        <rect x="148" y="390" width="34" height="44" />
        <rect x="212" y="394" width="34" height="40" />
        <rect x="276" y="380" width="34" height="54" />
        <rect x="340" y="384" width="34" height="50" />
        <rect x="404" y="370" width="34" height="64" />
    </g>
    <g fill="#7c8cff" fill-opacity=".7">
        <rect x="468" y="374" width="34" height="60" />
        <rect x="532" y="362" width="34" height="72" />
    </g>
    <g fill="#00eeff">
        <rect x="596" y="352" width="34" height="82" />
        <rect x="660" y="346" width="34" height="88" />
    </g>
</svg>
